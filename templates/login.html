<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion — VisionCam</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
    <main class="login">
        <form method="post" class="panel">
            <h1>Vision<span style="color: var(--accent);">Cam</span></h1>
            <p class="muted" style="margin: 0;">Connexion requise pour accéder au flux et à la base.</p>
            {% if error %}<div class="alert" role="alert">{{ error }}</div>{% endif %}
            <div class="field">
                <label for="password">Mot de passe</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
            </div>
            <button type="submit" class="primary">Se connecter</button>
        </form>
    </main>
</body>
</html>
