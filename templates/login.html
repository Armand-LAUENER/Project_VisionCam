<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VisionCam — Connexion</title>
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: #0b0f17; color: #e5e7eb;
        }
        form {
            width: 100%; max-width: 360px; padding: 28px; border-radius: 14px;
            background: #131a26; border: 1px solid #243044;
        }
        h1 { margin: 0 0 4px; font-size: 1.25rem; }
        p { margin: 0 0 20px; color: #94a3b8; font-size: .9rem; }
        label { display: block; font-size: .85rem; margin-bottom: 6px; color: #cbd5e1; }
        input {
            width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #334155;
            background: #0b0f17; color: inherit; font-size: 1rem;
        }
        input:focus { outline: 2px solid #38bdf8; outline-offset: 1px; }
        button {
            width: 100%; margin-top: 16px; padding: 10px; border: 0; border-radius: 8px;
            background: #0ea5e9; color: #04111c; font-weight: 600; font-size: 1rem; cursor: pointer;
        }
        button:hover { background: #38bdf8; }
        .error {
            margin: 0 0 16px; padding: 10px 12px; border-radius: 8px;
            background: #3b1219; color: #fecaca; font-size: .9rem;
        }
    </style>
</head>
<body>
    <form method="post">
        <h1>VisionCam</h1>
        <p>Connexion requise pour accéder au flux et à la base.</p>
        {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
        <label for="password">Mot de passe</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
        <button type="submit">Se connecter</button>
    </form>
</body>
</html>
